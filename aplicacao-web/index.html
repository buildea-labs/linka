<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon multi-formato: ICO p/ legacy + PNGs para Chrome/Firefox (2026-05). -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Linka Speedtest — meça a qualidade real da sua internet em segundos. Um medidor minimalista, leve e com foco na privacidade dos seus dados." />
    
    <!-- Google Search Console & SEO Robots -->
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="google-site-verification" content="COLOQUE_SEU_CODIGO_DO_GSC_AQUI" />
    
    <!-- Open Graph / Social SEO -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Linka Speedtest" />
    <meta property="og:description" content="Medir a internet não precisa ser feio. Descubra sua velocidade real em segundos com nossa ferramenta minimalista e focada em privacidade." />
    <meta property="og:image" content="/og-image-v2.jpg" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Linka Speedtest" />
    <meta name="twitter:description" content="Medir a internet não precisa ser feio. Descubra sua velocidade real em segundos." />
    <meta name="twitter:image" content="/og-image-v2.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <title>Linka Speedtest</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
