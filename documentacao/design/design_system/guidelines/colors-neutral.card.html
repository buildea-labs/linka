<!-- @dsCard group="Colors" viewport="760x160" name="Surface & Text" subtitle="bg / grouped-bg / surface / fg / muted / border" -->
<html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;font-family:var(--font-mono);background:var(--surface-page)">
<div style="display:flex;gap:14px">
  <div><div style="width:90px;height:60px;border-radius:8px;border:1px solid var(--border-default);background:var(--color-bg)"></div><div style="font-size:11px;color:var(--text-secondary);margin-top:6px">--color-bg</div></div>
  <div><div style="width:90px;height:60px;border-radius:8px;border:1px solid var(--border-default);background:var(--color-bg-grouped)"></div><div style="font-size:11px;color:var(--text-secondary);margin-top:6px">--color-bg-grouped</div></div>
  <div><div style="width:90px;height:60px;border-radius:8px;border:1px solid var(--border-default);background:var(--color-surface)"></div><div style="font-size:11px;color:var(--text-secondary);margin-top:6px">--color-surface</div></div>
  <div><div style="width:90px;height:60px;border-radius:8px;background:var(--color-fg)"></div><div style="font-size:11px;color:var(--text-secondary);margin-top:6px">--color-fg</div></div>
  <div><div style="width:90px;height:60px;border-radius:8px;background:var(--color-muted)"></div><div style="font-size:11px;color:var(--text-secondary);margin-top:6px">--color-muted</div></div>
  <div><div style="width:90px;height:60px;border-radius:8px;background:var(--color-border)"></div><div style="font-size:11px;color:var(--text-secondary);margin-top:6px">--color-border</div></div>
</div>
</body></html>
