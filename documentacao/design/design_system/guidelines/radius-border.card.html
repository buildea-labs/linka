<!-- @dsCard group="Spacing" viewport="760x180" name="Radius & Border" subtitle="Continuous-corner scale: 10 / 14 / 20 / 28, hairline separators" -->
<html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;background:var(--surface-page);display:flex;gap:16px;font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)">
<div><div style="width:100px;height:80px;border:1px solid var(--border-default);border-radius:var(--radius-sm)"></div><div style="margin-top:6px">--radius-sm 10px</div></div>
<div><div style="width:100px;height:80px;border:0.5px solid var(--border-default);border-radius:var(--radius)"></div><div style="margin-top:6px">--radius 14px</div></div>
<div><div style="width:100px;height:80px;border:0.5px solid var(--border-default);border-radius:var(--radius-lg)"></div><div style="margin-top:6px">--radius-lg 20px</div></div>
<div><div style="width:100px;height:80px;border:0.5px solid var(--border-default);border-radius:var(--radius-xl)"></div><div style="margin-top:6px">--radius-xl 28px</div></div>
<div><div style="width:100px;height:80px;border:1px dashed var(--border-default);border-radius:var(--radius-sm)"></div><div style="margin-top:6px">dashed placeholder</div></div>
</body></html>
