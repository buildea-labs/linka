<!-- @dsCard group="Type" viewport="760x420" name="Apple Text Styles" subtitle="HIG type ladder — largeTitle through caption2, rendered in the native system stack" -->
<html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:24px;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-body)">
<div style="display:flex;flex-direction:column;gap:10px">
<div style="font-size:var(--text-large-title);font-weight:var(--weight-bold);letter-spacing:var(--tracking-tight)">Large Title 34</div>
<div style="font-size:var(--text-title1);font-weight:var(--weight-bold);letter-spacing:var(--tracking-snug)">Title 1 · 28</div>
<div style="font-size:var(--text-title2);font-weight:var(--weight-semibold)">Title 2 · 22</div>
<div style="font-size:var(--text-title3);font-weight:var(--weight-semibold)">Title 3 · 20</div>
<div style="font-size:var(--text-headline);font-weight:var(--weight-semibold)">Headline · 17</div>
<div style="font-size:var(--text-md);font-weight:var(--weight-regular)">Body · 17</div>
<div style="font-size:var(--text-callout);color:var(--text-secondary)">Callout · 16</div>
<div style="font-size:var(--text-subheadline);color:var(--text-secondary)">Subheadline · 15</div>
<div style="font-size:var(--text-footnote);color:var(--text-secondary)">Footnote · 13</div>
<div style="font-size:var(--text-caption1);color:var(--text-secondary);text-transform:uppercase;letter-spacing:var(--tracking-wide)">Caption 1 · 12</div>
<div style="font-size:var(--text-caption2);color:var(--text-secondary);text-transform:uppercase;letter-spacing:var(--tracking-wider)">Caption 2 · 11</div>
</div>
</body></html>
