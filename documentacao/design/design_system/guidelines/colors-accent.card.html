<!-- @dsCard group="Colors" viewport="760x150" name="Accent" subtitle="Navy ink primary + a single restrained warm-orange pop (the i-dot only)" -->
<html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;font-family:var(--font-mono);background:var(--surface-page)">
<div style="display:flex;gap:14px;align-items:flex-start">
  <div><div style="width:110px;height:60px;border-radius:8px;background:var(--color-accent)"></div><div style="font-size:11px;color:var(--text-secondary);margin-top:6px">--color-accent</div></div>
  <div><div style="width:110px;height:60px;border-radius:8px;background:var(--color-accent-soft);border:1px solid var(--border-default)"></div><div style="font-size:11px;color:var(--text-secondary);margin-top:6px">--color-accent-soft</div></div>
  <div><div style="width:110px;height:60px;border-radius:8px;background:var(--color-accent-warm)"></div><div style="font-size:11px;color:var(--text-secondary);margin-top:6px">--color-accent-warm</div></div>
  <div><div style="width:110px;height:60px;border-radius:8px;background:var(--color-fill)"></div><div style="font-size:11px;color:var(--text-secondary);margin-top:6px">--color-fill</div></div>
  <div><div style="width:110px;height:60px;border-radius:8px;background:var(--surface-page);border:0.5px solid var(--color-separator)"></div><div style="font-size:11px;color:var(--text-secondary);margin-top:6px">--color-separator</div></div>
</div>
</body></html>
