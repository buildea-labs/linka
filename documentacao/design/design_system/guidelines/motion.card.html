<body style="margin:0;padding:24px;background:var(--surface-page);font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);display:flex;gap:40px;align-items:flex-start">
<div><div class="m spring"></div><div style="margin-top:10px">--ease-spring · press &amp; disclosure</div></div>
<div><div class="m std" style="background:var(--color-accent-warm)"></div><div style="margin-top:10px">--ease-standard · fades &amp; color</div></div>
</body></html>
