name: iOS CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'bug/**'
      - 'release/**'
  pull_request:

jobs:
  swift-modules:
    name: Swift package tests
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Test NetworkCore
        working-directory: aplicativo-ios/NetworkCore
        run: swift test

      - name: Test MeasurementHistory
        working-directory: aplicativo-ios/MeasurementHistory
        run: swift test

      - name: Test NetworkInsights
        working-directory: aplicativo-ios/NetworkInsights
        run: swift test

      - name: Test NetworkAssist
        working-directory: aplicativo-ios/NetworkAssist
        run: swift test

      - name: Test NetworkDiagnostics
        working-directory: aplicativo-ios/NetworkDiagnostics
        run: swift test

      - name: Test NetworkConnectivityTriage
        working-directory: aplicativo-ios/NetworkConnectivityTriage
        run: swift test

      - name: Test LinkaEntitlements
        working-directory: aplicativo-ios/LinkaEntitlements
        run: swift test

      - name: Test LinkaAppIntents
        working-directory: aplicativo-ios/LinkaAppIntents
        run: swift test

      - name: Test LinkaModules compatibility
        working-directory: aplicativo-ios/LinkaModules
        run: swift test

      - name: Test LinkaEngine
        working-directory: aplicativo-ios/LinkaEngine
        run: swift test

      - name: Test LinkaWidgetShared
        working-directory: aplicativo-ios/LinkaWidgetShared
        run: swift test

  xcodebuild-app-ios:
    name: LinkaApp build and test (iOS)
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: aplicativo-ios
        run: xcodegen generate

      - name: Test LinkaApp for iOS Simulator
        working-directory: aplicativo-ios
        run: |
          xcodebuild test \
            -project LinkaApp.xcodeproj \
            -scheme LinkaApp_iOS \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release (Smoke Test)
        working-directory: aplicativo-ios
        run: |
          xcodebuild build \
            -project LinkaApp.xcodeproj \
            -scheme LinkaApp_iOS \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -configuration Release \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

  version-validation:
    name: Validate Versioning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Marketing Version Format
        working-directory: aplicativo-ios
        run: |
          MARKETING_VERSION=$(grep 'MARKETING_VERSION:' project.yml | head -n 1 | awk -F '"' '{print $2}')
          echo "Marketing version is $MARKETING_VERSION"
          if [[ ! "$MARKETING_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && [[ ! "$MARKETING_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Error: MARKETING_VERSION does not follow SemVer format (e.g. 1.0.0 or 1.0)"
            exit 1
          fi

      - name: Validate Build Number Format
        working-directory: aplicativo-ios
        run: |
          BUILD_NUMBER=$(grep 'CURRENT_PROJECT_VERSION:' project.yml | head -n 1 | awk -F '"' '{print $2}')
          echo "Build number is $BUILD_NUMBER"
          if [[ ! "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Error: CURRENT_PROJECT_VERSION must be an integer"
            exit 1
          fi

      - name: Check tags on release creation
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: aplicativo-ios
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          EXPECTED_VERSION=${TAG_NAME#v}
          MARKETING_VERSION=$(grep 'MARKETING_VERSION:' project.yml | head -n 1 | awk -F '"' '{print $2}')
          if [ "$EXPECTED_VERSION" != "$MARKETING_VERSION" ]; then
            echo "Error: Git tag ($TAG_NAME) does not match project version ($MARKETING_VERSION)."
            exit 1
          fi
