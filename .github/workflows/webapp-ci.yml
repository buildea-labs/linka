# CI — aplicacao-web/ (ex-repo linka-webapp, consolidado em 2026-07-23)
#
# Só dispara quando algo em aplicacao-web/ muda (`paths`) — app standalone, com seu
# próprio lint/testes/build, isolado do CI da raiz (linka-speedtest).
#
# Etapas: npm ci → lint (opcional) → test → build, tudo com
# `working-directory: aplicacao-web`.

name: CI (aplicacao-web)

on:
  push:
    branches: ['**']
    paths: ['aplicacao-web/**']
  pull_request:
    branches: ['main']
    paths: ['aplicacao-web/**']

concurrency:
  group: ci-aplicacao-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test e build (aplicacao-web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: aplicacao-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aplicacao-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-dist
          path: aplicacao-web/dist/
          retention-days: 7
