name: Deploy to TestFlight

# Uma entrega nunca nasce de uma branch solta: ela é disparada manualmente na
# main, depois do merge de uma PR candidata e da autorização humana no ambiente
# protegido "testflight".
on:
  workflow_dispatch:

permissions:
  contents: write # registra a tag imutável da build que a Apple processou

concurrency:
  group: linka-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Build, upload and verify TestFlight
    runs-on: macos-latest
    timeout-minutes: 45
    environment: testflight

    steps:
      - name: Refuse anything other than main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "TestFlight só pode ser disparado a partir da main."
          exit 1

      - name: Checkout exact release revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm current main revision
        run: |
          git fetch origin main:refs/remotes/origin/main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"

      - name: Read release identity
        id: release
        working-directory: aplicativo-ios
        run: |
          VERSION=$(awk -F '"' '/MARKETING_VERSION:/ { print $2; exit }' project.yml)
          BUILD=$(awk -F '"' '/CURRENT_PROJECT_VERSION:/ { print $2; exit }' project.yml)
          test -n "$VERSION" && test -n "$BUILD"
          test -s ../RELEASE_NOTES.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Validate the exact release revision on simulator
        working-directory: aplicativo-ios
        run: |
          xcodegen generate
          xcodebuild test \
            -project LinkaApp.xcodeproj \
            -scheme LinkaApp \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
          xcodebuild build \
            -project LinkaApp.xcodeproj \
            -scheme LinkaApp \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -configuration Release \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Setup Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Archive, upload and wait for Apple processing
        run: bundle exec fastlane beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Tag the processed build
        env:
          VERSION: ${{ steps.release.outputs.version }}
          BUILD: ${{ steps.release.outputs.build }}
        run: |
          TAG="testflight/v${VERSION}-b${BUILD}"
          git rev-parse -q --verify "refs/tags/$TAG" && { echo "Tag $TAG já existe."; exit 1; } || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "TestFlight ${VERSION} (${BUILD})"
          git push origin "$TAG"

      - name: Publish provenance
        uses: actions/upload-artifact@v4
        with:
          name: testflight-evidence-${{ steps.release.outputs.version }}-${{ steps.release.outputs.build }}
          path: build/testflight-evidence.json
          if-no-files-found: error
