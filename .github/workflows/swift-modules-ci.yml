name: Swift Modules CI

on:
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'aplicativo-ios/**'
      - '.github/workflows/swift-modules-ci.yml'
  pull_request:
    paths:
      - 'aplicativo-ios/**'
      - '.github/workflows/swift-modules-ci.yml'

jobs:
  swift-modules:
    name: Swift package tests
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Test NetworkCore
        working-directory: aplicativo-ios/NetworkCore
        run: swift test

      - name: Test MeasurementHistory
        working-directory: aplicativo-ios/MeasurementHistory
        run: swift test

      - name: Test NetworkInsights
        working-directory: aplicativo-ios/NetworkInsights
        run: swift test

      - name: Test NetworkAssist
        working-directory: aplicativo-ios/NetworkAssist
        run: swift test

      - name: Test NetworkDiagnostics
        working-directory: aplicativo-ios/NetworkDiagnostics
        run: swift test

      - name: Test LinkaEntitlements
        working-directory: aplicativo-ios/LinkaEntitlements
        run: swift test

      - name: Test LinkaAppIntents
        working-directory: aplicativo-ios/LinkaAppIntents
        run: swift test

      - name: Test LinkaModules compatibility
        working-directory: aplicativo-ios/LinkaModules
        run: swift test

      - name: Test LinkaEngine
        working-directory: aplicativo-ios/LinkaEngine
        run: swift test

      - name: Test LinkaWidgetShared
        working-directory: aplicativo-ios/LinkaWidgetShared
        run: swift test

  xcodebuild-app-ios:
    name: LinkaApp build and test (iOS)
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Test LinkaApp for iOS Simulator
        run: |
          xcodebuild test \
            -project aplicativo-ios/LinkaApp.xcodeproj \
            -scheme LinkaApp_iOS \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

  xcodebuild-app-macos:
    name: LinkaApp build (macOS)
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build LinkaApp for macOS
        run: |
          xcodebuild build \
            -project aplicativo-ios/LinkaApp.xcodeproj \
            -scheme LinkaApp_macOS \
            -destination 'platform=macOS' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
