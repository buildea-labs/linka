name: LinkaApp
options:
  bundleIdPrefix: com.linka
targets:
  LinkaApp:
    type: application
    platform: [iOS, macOS]
    deploymentTarget:
      iOS: 16.0
      macOS: 13.0
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    sources:
      - path: LinkaApp/Sources
    dependencies:
      - package: LinkaEngine
packages:
  LinkaEngine:
    path: LinkaEngine
