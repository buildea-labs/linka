name: LinkaApp
options:
  bundleIdPrefix: com.linka
targets:
  LinkaApp:
    type: application
    platform: [iOS, macOS]
    deploymentTarget:
      iOS: 16.0
      macOS: 13.0
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGN_ENTITLEMENTS: LinkaApp/LinkaApp.entitlements
    info:
      path: LinkaApp/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        GADApplicationIdentifier: "ca-app-pub-3940256099942544~1458002511"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: LinkaApp/Sources
    dependencies:
      - package: LinkaEngine
      - package: LinkaModules
      - package: MeasurementHistoryCloudKit
      - package: GoogleMobileAds
  # Único target XCTest que alcança o módulo do app (issue #65) — o resto
  # do repo é pacotes SPM com `Tests/` próprios, mas `SpeedTestViewModel`
  # vive dentro do target Xcode `LinkaApp`, que não tinha nenhum target de
  # teste até aqui. Hospedado só por `LinkaApp_iOS`: a lógica coberta
  # (`SpeedTestViewModel.handleScenePhaseChange`) é Swift/SwiftUI puro, sem
  # nenhum branch condicional de plataforma, então testar via um host basta
  # — tentar espelhar como target multiplataforma (`LinkaAppTests_macOS`
  # hospedado por `LinkaApp_macOS`) produziu wiring de dependência quebrado
  # nesta versão do XcodeGen (`platformFilter` incorreto nos dois target
  # dependency edges gerados). Ver nota no PR desta issue.
  LinkaAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget:
      iOS: 16.0
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: LinkaApp/Tests
    dependencies:
      - target: LinkaApp_iOS
packages:
  LinkaEngine:
    path: LinkaEngine
  LinkaModules:
    path: LinkaModules
  MeasurementHistoryCloudKit:
    path: MeasurementHistoryCloudKit
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 11.8.0
