name: LinkaApp
options:
  bundleIdPrefix: com.linka
settings:
  base:
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "43"
targets:
  LinkaApp:
    type: application
    platform: iOS
    deploymentTarget:
      iOS: 16.0
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: LinkaApp/LinkaApp.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "2Z4T8228GR"
        PRODUCT_BUNDLE_IDENTIFIER: com.linka.assist
    info:
      path: LinkaApp/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLName: com.linka.wifi-advanced
            CFBundleURLSchemes:
              - linka
        NDAssistRelayEndpoint: "https://linka-assist-relay.buildealabs.workers.dev/v2/assist"
        NSLocationWhenInUseUsageDescription: "O Linka usa a localização apenas porque o iPhone exige essa autorização para informar o nome da rede Wi-Fi atual. Sua localização não é salva para identificar a rede."
        NSLocalNetworkUsageDescription: "O Linka consulta o roteador da rede local para identificar o equipamento e diagnosticar a qualidade da conexão Wi-Fi."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: LinkaApp/Sources
    dependencies:
      - package: LinkaEngine
      - package: LinkaModules
      - package: NetworkConnectivityTriage
      - package: LinkaAppIntents
      - package: MeasurementHistoryCloudKit
      - package: LinkaWidgetShared
      - target: LinkaWidgetExtension
        embed: true
        codeSign: true
        platforms: [iOS]
  LinkaAppUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    deploymentTarget: 16.0
    dependencies:
      - target: LinkaApp
    sources:
      - path: ../store/app-store/screenshots

  LinkaAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget:
      iOS: 16.0
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: LinkaApp/Tests
    dependencies:
      - target: LinkaApp
  LinkaWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget:
      iOS: 17.0
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.linka.assist.Widget
        PRODUCT_NAME: LinkaWidget
        CODE_SIGN_ENTITLEMENTS: LinkaWidget/LinkaWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "2Z4T8228GR"
    info:
      path: LinkaWidget/Info.plist
      properties:
        CFBundleDisplayName: Linka SpeedTest
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      - path: LinkaWidget/Sources
      - path: LinkaApp/Sources/UI/DesignSystem.swift
    dependencies:
      - package: LinkaAppIntents
      - package: LinkaWidgetShared
packages:
  LinkaEngine:
    path: LinkaEngine
  LinkaModules:
    path: LinkaModules
  NetworkConnectivityTriage:
    path: NetworkConnectivityTriage
  LinkaAppIntents:
    path: LinkaAppIntents
  MeasurementHistoryCloudKit:
    path: MeasurementHistoryCloudKit
  LinkaWidgetShared:
    path: LinkaWidgetShared

