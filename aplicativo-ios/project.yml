name: LinkaApp
options:
  bundleIdPrefix: com.linka
targets:
  LinkaApp:
    type: application
    platform: [iOS, macOS]
    deploymentTarget:
      iOS: 16.0
      macOS: 13.0
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGN_ENTITLEMENTS: LinkaApp/LinkaApp.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "2Z4T8228GR"
    info:
      path: LinkaApp/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLName: com.linka.wifi-advanced
            CFBundleURLSchemes:
              - linka
        GADApplicationIdentifier: "ca-app-pub-3940256099942544~1458002511"
        NDAssistRelayEndpoint: "https://linka-assist-relay.buildealabs.workers.dev/v1/assist"
        NSLocationWhenInUseUsageDescription: "O Linka usa a localização apenas porque o iPhone exige essa autorização para informar o nome da rede Wi-Fi atual. Sua localização não é salva para identificar a rede."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: LinkaApp/Sources
    dependencies:
      - package: LinkaEngine
      - package: LinkaModules
      - package: LinkaAppIntents
      - package: GoogleMobileAds
        platforms: [iOS]
  LinkaAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget:
      iOS: 16.0
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: LinkaApp/Tests
    dependencies:
      - target: LinkaApp_iOS
packages:
  LinkaEngine:
    path: LinkaEngine
  LinkaModules:
    path: LinkaModules
  LinkaAppIntents:
    path: LinkaAppIntents
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 11.8.0
